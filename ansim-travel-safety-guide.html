<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외여행 안심 정보 검색 | 안심여행정보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12233f;
    --navy-2:#1c3660;
    --ink:#1b2430;
    --sub:#4b5768;
    --line:#e4e8ef;
    --bg:#f4f6fa;
    --card:#ffffff;
    --accent:#c8912b;
    --accent-2:#e7a83a;
    --accent-soft:#fbf1de;
    --danger:#b5372c;
    --danger-soft:#fbe9e7;
    --ok:#1c6e4a;
    --ok-soft:#e7f4ee;
    --radius:16px;
    --shadow:0 10px 30px rgba(18,35,63,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 80px;}

  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:38px 22px 34px;
    border-radius:0 0 28px 28px;
    text-align:center;
  }
  header.top .eyebrow{
    display:inline-block;
    font-size:13px;
    letter-spacing:.12em;
    color:var(--accent-2);
    font-weight:700;
    margin-bottom:10px;
  }
  header.top h1{
    margin:0 0 10px;
    font-size:clamp(24px,5vw,32px);
    font-weight:900;
    line-height:1.35;
  }
  header.top p{
    margin:0;
    font-size:15.5px;
    color:#c9d4e6;
    font-weight:500;
  }

  .search-panel{
    max-width:760px;
    margin:-30px auto 0;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
    position:relative;
    z-index:5;
  }
  .search-box{position:relative;}
  .search-box input{
    width:100%;
    font-size:18px;
    font-weight:500;
    padding:16px 48px 16px 18px;
    border-radius:12px;
    border:2px solid var(--line);
    outline:none;
    font-family:inherit;
    color:var(--ink);
    background:#fbfbfd;
  }
  .search-box input:focus{border-color:var(--accent);background:#fff;}
  .search-box .icon{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:20px;pointer-events:none;color:var(--sub);
  }
  .suggest{
    position:absolute;left:0;right:0;top:calc(100% + 6px);
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);
    max-height:320px;overflow-y:auto;
    display:none;
    z-index:20;
  }
  .suggest.show{display:block;}
  .suggest button{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:none;border:0;
    padding:13px 16px;font-size:16px;font-family:inherit;color:var(--ink);
    cursor:pointer;border-bottom:1px solid var(--line);
  }
  .suggest button:last-child{border-bottom:0;}
  .suggest button:hover, .suggest button.active{background:var(--accent-soft);}
  .suggest .flag{font-size:20px;}
  .suggest .country{color:var(--sub);font-size:13.5px;margin-left:auto;font-weight:500;}

  .quick-row{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  }
  .quick-row button{
    font-family:inherit;font-size:13.5px;font-weight:600;
    background:var(--bg);border:1px solid var(--line);color:var(--sub);
    padding:8px 13px;border-radius:999px;cursor:pointer;
  }
  .quick-row button:hover{border-color:var(--accent);color:var(--accent);}

  .filter-row{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .filter-row label{font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap;}
  .filter-row select{
    flex:1;min-width:180px;
    font-family:inherit;font-size:15.5px;font-weight:500;color:var(--ink);
    padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);
    background:#fbfbfd;
  }

  #result{max-width:760px;margin:26px auto 0;}
  .empty-state{
    text-align:center;color:var(--sub);padding:60px 20px;font-size:15.5px;
  }
  .empty-state .big{font-size:44px;margin-bottom:10px;display:block;}

  .country-head{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;
  }
  .country-head .flag{font-size:38px;}
  .country-head h2{margin:0;font-size:23px;font-weight:900;color:var(--navy);}
  .country-head .cur{margin-top:3px;font-size:13.5px;color:var(--sub);font-weight:600;}

  .cat-card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 22px 20px;margin-bottom:14px;
  }
  .cat-card h3{
    margin:0 0 14px;font-size:17.5px;font-weight:800;color:var(--navy);
    display:flex;align-items:center;gap:9px;
  }
  .cat-card h3 .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;background:var(--accent-soft);
    color:var(--accent);font-size:13px;font-weight:900;flex:none;
  }
  .cat-card ul{margin:0;padding-left:20px;}
  .cat-card li{margin-bottom:9px;font-size:15.8px;color:var(--ink);}
  .cat-card li:last-child{margin-bottom:0;}
  .cat-card li.warn{
    list-style:none;margin-left:-20px;
    background:var(--danger-soft);color:#7a281f;border-radius:10px;
    padding:12px 14px;font-weight:600;
  }

  .em-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
  .em-item{
    background:var(--bg);border-radius:12px;padding:14px 12px;text-align:center;
  }
  .em-item .lbl{font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:5px;}
  .em-item .num{font-size:21px;font-weight:900;color:var(--danger);}
  .cc-box{
    background:var(--ok-soft);border-radius:12px;padding:14px 16px;margin-bottom:12px;
    font-size:15px;color:#164a34;font-weight:600;
  }
  .cc-box b{color:var(--ok);}
  .consulate-box{
    background:var(--bg);border-radius:12px;padding:14px 16px;
    font-size:14.8px;color:var(--sub);line-height:1.6;
  }

  footer{
    max-width:760px;margin:34px auto 0;text-align:center;
    color:var(--sub);font-size:13px;line-height:1.8;padding:0 10px;
  }
  footer .brand{font-weight:800;color:var(--navy);font-size:14.5px;margin-bottom:6px;}
  .disclaimer{
    max-width:760px;margin:20px auto 0;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;font-size:13px;color:var(--sub);line-height:1.75;
  }
  .disclaimer b{color:var(--ink);}

  @media (max-width:480px){
    body{font-size:16px;}
    .wrap{padding:18px 12px 60px;}
    header.top{padding:30px 16px 28px;border-radius:0 0 22px 22px;}
    .search-panel{margin-top:-22px;padding:16px;}
    .cat-card{padding:18px 16px 16px;}
  }
</style>
</head>
<body>
<header class="top">
  <span class="eyebrow">안심여행정보</span>
  <h1>해외여행 안심 정보 검색</h1>
  <p>여행지를 검색하면 안전수칙부터 응급연락처, 사기 예방법까지 한눈에 확인할 수 있어요</p>
</header>

<div class="wrap">
  <div class="search-panel">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="여행지를 입력하세요 (예: 다낭, 방콕, 로마)" autocomplete="off">
      <span class="icon">🔍</span>
      <div id="suggest" class="suggest"></div>
    </div>
    <div class="quick-row" id="quickRow"></div>
    <div class="filter-row">
      <label for="catSelect">궁금한 항목</label>
      <select id="catSelect"></select>
    </div>
  </div>

  <div id="result">
    <div class="empty-state">
      <span class="big">🧭</span>
      위에서 여행지를 검색하면<br>해당 국가의 안심 정보가 여기에 나와요
    </div>
  </div>

  <div class="disclaimer">
    <b>안내:</b> 본 정보는 외교부 해외안전여행(0404.go.kr) 등 공개 자료를 참고해 정리했으며, 응급전화번호·영사관 연락처·여행경보 단계 등은 수시로 변경될 수 있습니다. 출국 전 반드시 0404.go.kr에서 최신 정보를 한 번 더 확인하시길 권해 드립니다.
  </div>

  <footer>
    <div class="brand">안심여행정보</div>
    안전한 해외여행을 위한 정보를 담았습니다.
  </footer>
</div>

// build search index: city/alias -> country code
const INDEX = [];
Object.keys(DATA).forEach(code=>{
  const d = DATA[code];
  d.cities.forEach(city=>{
    INDEX.push({label:city, code:code});
  });
});

const searchInput = document.getElementById('searchInput');
const suggestBox = document.getElementById('suggest');
const resultBox = document.getElementById('result');
const quickRow = document.getElementById('quickRow');

// quick chips: 15 country names
const QUICK = Object.keys(DATA).map(code=>({code, label:DATA[code].name, flag:DATA[code].flag}));
QUICK.forEach(q=>{
  const btn = document.createElement('button');
  btn.textContent = q.flag + ' ' + q.label;
  btn.addEventListener('click', ()=>{
    searchInput.value = q.label;
    selectCountry(q.code);
    suggestBox.classList.remove('show');
  });
  quickRow.appendChild(btn);
});

let currentCode = null;
let activeSuggestIndex = -1;

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  activeSuggestIndex = -1;
  if(!q){ suggestBox.classList.remove('show'); suggestBox.innerHTML=''; return; }
  const matches = INDEX.filter(item=> item.label.includes(q) );
  // dedupe by code, prefer exact-ish match order, cap at 8
  const seen = new Set();
  const uniq = [];
  matches.forEach(m=>{
    const k = m.code+'|'+m.label;
    if(!seen.has(k)){ seen.add(k); uniq.push(m); }
  });
  renderSuggest(uniq.slice(0,8));
});

searchInput.addEventListener('keydown', (e)=>{
  const items = suggestBox.querySelectorAll('button');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(items.length===0) return;
    activeSuggestIndex = (activeSuggestIndex+1) % items.length;
    updateActive(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(items.length===0) return;
    activeSuggestIndex = (activeSuggestIndex-1+items.length) % items.length;
    updateActive(items);
  } else if(e.key === 'Enter'){
    if(activeSuggestIndex>=0 && items[activeSuggestIndex]){
      items[activeSuggestIndex].click();
    } else if(items.length>0){
      items[0].click();
    }
  } else if(e.key === 'Escape'){
    suggestBox.classList.remove('show');
  }
});

function updateActive(items){
  items.forEach((it,i)=> it.classList.toggle('active', i===activeSuggestIndex));
  if(activeSuggestIndex>=0) items[activeSuggestIndex].scrollIntoView({block:'nearest'});
}

function renderSuggest(list){
  if(list.length===0){ suggestBox.classList.remove('show'); suggestBox.innerHTML=''; return; }
  suggestBox.innerHTML = list.map(item=>{
    const d = DATA[item.code];
    return '<button type="button" data-code="'+item.code+'" data-label="'+item.label+'">'
      + '<span class="flag">'+d.flag+'</span>'
      + '<span>'+item.label+'</span>'
      + '<span class="country">'+d.name+'</span>'
      + '</button>';
  }).join('');
  suggestBox.classList.add('show');
  suggestBox.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      searchInput.value = btn.getAttribute('data-label');
      selectCountry(btn.getAttribute('data-code'));
      suggestBox.classList.remove('show');
    });
  });
}

document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-box')){ suggestBox.classList.remove('show'); }
});

catSelect.addEventListener('change', ()=>{
  if(currentCode) renderResult(currentCode);
});

function selectCountry(code){
  currentCode = code;
  renderResult(code);
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function listHtml(arr){
  if(!arr || arr.length===0) return '<p style="color:var(--sub);font-size:14.5px;">등록된 정보가 준비 중이에요.</p>';
  return '<ul>' + arr.map(t=>{
    const isWarn = t.indexOf('[꼭 확인하세요]') === 0;
    const text = isWarn ? t.replace('[꼭 확인하세요] ', '⚠️ ') : t;
    return '<li'+(isWarn?' class="warn"':'')+'>'+esc(text)+'</li>';
  }).join('') + '</ul>';
}

function emergencyHtml(em){
  let grid = '<div class="em-grid">';
  grid += '<div class="em-item"><div class="lbl">경찰</div><div class="num">'+esc(em.police)+'</div></div>';
  grid += '<div class="em-item"><div class="lbl">구급</div><div class="num">'+esc(em.ambulance)+'</div></div>';
  grid += '<div class="em-item"><div class="lbl">화재</div><div class="num">'+esc(em.fire)+'</div></div>';
  grid += '</div>';
  if(em.extra){
    grid += '<div class="consulate-box" style="margin-bottom:12px;"><b>추가 연락처</b><br>'+esc(em.extra)+'</div>';
  }
  grid += '<div class="cc-box"><b>🇰🇷 외교부 영사콜센터(전 세계 공통, 24시간)</b><br>'
    + '해외에서 국제전화로 <b>+82-2-3210-0404</b> · 카카오톡 채널 "외교부 영사콜센터" · 무료전화 앱 "영사콜센터 무료전화"로도 상담 가능해요.</div>';
  grid += '<div class="consulate-box"><b>재외공관</b><br>'+esc(em.consulate)+'</div>';
  return grid;
}

function catCardHtml(catKey, catLabel, catIcon, num, country){
  let body = '';
  if(catKey === 'emergency'){
    body = emergencyHtml(country.cats.emergency);
  } else {
    body = listHtml(country.cats[catKey]);
  }
  return '<div class="cat-card">'
    + '<h3><span class="num">'+num+'</span>'+catIcon+' '+esc(catLabel)+'</h3>'
    + body
    + '</div>';
}

function renderResult(code){
  const country = DATA[code];
  if(!country){ return; }
  const selectedCat = catSelect.value;
  let html = '<div class="country-head"><span class="flag">'+country.flag+'</span><div><h2>'+esc(country.name)+'</h2><div class="cur">통화: '+esc(country.currency)+'</div></div></div>';

  const catsToShow = selectedCat === 'all' ? CATS.slice(1) : CATS.filter(c=>c.key===selectedCat);
  catsToShow.forEach((c,i)=>{
    html += catCardHtml(c.key, c.label, c.icon, i+1, country);
  });

  resultBox.innerHTML = html;
}
</script>
</body>
</html>
